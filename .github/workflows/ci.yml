name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Load the built package from ESM and CommonJS
        run: |
          node -e "const m = require('./dist/index.cjs'); if (typeof m.AyInbox !== 'function') process.exit(1)"
          node --input-type=module -e "import { AyInbox } from './dist/index.js'; if (typeof AyInbox !== 'function') process.exit(1)"

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm pack --dry-run
      - name: JSR dry run
        run: npx --yes jsr@0.14.3 publish --dry-run --allow-dirty
